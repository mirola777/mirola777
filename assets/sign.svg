<svg xmlns="http://www.w3.org/2000/svg" width="300" height="56" viewBox="0 0 300 56" role="img" aria-label="Sign the guestbook">
<style>
@keyframes glow { 0%,100% { opacity: .35 } 50% { opacity: .9 } }
@keyframes nudge { 0%,100% { transform: translateX(0) } 50% { transform: translateX(4px) } }
.g { animation: glow 2.4s ease-in-out infinite }
.n { animation: nudge 1.2s ease-in-out infinite }
</style>
<defs>
  <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#5eead4"/>
  </linearGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.07"/>
  </pattern></defs>
<rect class="g" x="1" y="1" width="298" height="54" rx="27.0" fill="none" stroke="url(#acc)" stroke-width="2"/>
<rect x="4" y="4" width="292" height="48" rx="24.0" fill="#0f1219"/>
<text x="140.0" y="33.0" text-anchor="middle" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#e8eaf0">sign the guestbook</text>
<text class="n" x="242.0" y="33.0" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#a78bfa">→</text>
</svg>
